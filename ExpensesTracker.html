<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="styles.css">
        <title>ExpenseTracker</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    </head>
    <body style="background-color: rgb(1, 2, 5); font-family:'Montserrat', Arial, sans-serif;
                font-weight: 500;
                margin: 0;
                box-shadow: inset 0 -100px 80px rgba(1, 7, 74, 0.7);
                ">
        <div style="display: grid;
                    grid-template-columns: 350px 1fr;">
            <div style="height: 728px ; display: grid; grid-template-rows: 1fr 1fr;">
                <div style="padding: 20px;" id="div1">PIE CHARt</div>
                <div>
                    <img src="result_0-removebg-preview.png" style="width: 348px;">
                </div>
            </div>
            <div style="display: grid; grid-template-rows: 80px 1fr;">
                <div style="display: grid; grid-template-columns: 1fr 80px;" class="others">
                    <div class="box" id="a" style="min-width: 207px;" id="total">
                        <p style="margin: 0; margin-left: 20px; font-weight: 600; font-size: 20px;">
                            Total Expenditure
                        </p>
                        <p style="font-size: 44px; margin: 0; margin-left: 20px;">
                            $12.04
                        </p>
                    </div>
                    <div style="text-align: center; font-size: 54px; padding-top: 6px;" class="box" id="add">
                        +
                    </div>
                    <div class="sidebar">
                        <p style="font-weight: 600; font-size: 30px; margin: 0;">Add expense</p>
                        <input type="text" placeholder="Amount" style="box-shadow: 0 0 10px rgba(1, 94, 187, 1); font-size: 20px; width:100%; margin-top: 5px; padding: 2px; padding-right: 6px; border-radius: 6px; border-style: solid; font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;">
                        <input type="text" placeholder="Category" style="box-shadow: 0 0 10px rgba(1, 94, 187, 1); font-size: 20px; width:100%; margin-top: 5px; padding: 2px; padding-right: 6px; border-radius: 6px; border-style: solid; font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;">
                        <input type="text" placeholder="Date" style="box-shadow: 0 0 10px rgba(1, 94, 187, 1); font-size: 20px; width:100%; margin-top: 5px; padding: 2px; padding-right: 6px; border-radius: 6px; border-style: solid; font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;">
                        <input type="text" placeholder="Discription" style="box-shadow: 0 0 10px rgba(1, 94, 187, 1); font-size: 20px; width:100%; margin-top: 5px; padding: 2px; padding-right: 6px; border-radius: 6px; border-style: solid; font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;">
                     
                        <p id="ad">add</p>
                    </div>
                </div>
                <div id="ex" style="margin-top: 6px;" class="box">
                    <p style="border-width: 0; border-bottom-width: 2px; border-style: solid; border-color: black; font-size: 20px; margin-top: 5px; padding-left: 16px;">EXPENSES</p>
                    <div style=" padding-left: 7px; margin-bottom: 3px; color: aqua;">div1</div>
                    <div style=" padding-left: 7px; margin-bottom: 3px; color: aqua;">div2</div>
                    <div style=" padding-left: 7px; margin-bottom: 3px; color: aqua;">div3</div>
                    <div style=" padding-left: 7px; margin-bottom: 3px; color: aqua;">div4</div>
                </div>
            </div>
        </div>
    </body>
</html>
